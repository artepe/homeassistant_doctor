<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500"><rect width="960" height="500" rx="26" fill="#0b1220"/><text x="45" y="82" fill="#63e4ca" font-family="Arial" font-size="22">LOCAL • READ-ONLY • OPEN SOURCE</text><text x="45" y="145" fill="#f2f6ff" font-family="Arial" font-size="60" font-weight="bold">HA Doctor</text><text x="45" y="185" fill="#acbbcd" font-family="Arial" font-size="22">Because “unavailable” is not a diagnosis.</text><rect x="45" y="220" width="870" height="105" rx="20" fill="#182638"/><text x="75" y="260" fill="#acbbcd" font-size="23" font-family="Arial">ENTITIES</text><text x="75" y="305" fill="#f2f6ff" font-size="36" font-family="Arial">1,256</text><text x="305" y="260" fill="#acbbcd" font-size="23" font-family="Arial">UNAVAILABLE</text><text x="305" y="305" fill="#ff7c94" font-size="36" font-family="Arial">8</text><text x="590" y="260" fill="#acbbcd" font-size="23" font-family="Arial">FLAPPING</text><text x="590" y="305" fill="#f7c16e" font-size="36" font-family="Arial">3</text><rect x="45" y="345" width="870" height="107" rx="20" fill="#182638"/><text x="75" y="394" fill="#ff7c94" font-size="24" font-family="Arial">●</text><text x="111" y="394" fill="#f2f6ff" font-size="22" font-family="Arial">Multiple sensors went unavailable together</text><text x="111" y="427" fill="#acbbcd" font-size="18" font-family="Arial">Inspect shared device connectivity, USB or API timeouts.</text></svg>