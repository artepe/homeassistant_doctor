[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-doctor-diagnostics"
version = "0.1.0"
description = "A local, read-only Home Assistant diagnostics CLI and offline dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "artepe"}]
keywords = ["home-assistant", "diagnostics", "iot", "health-check", "troubleshooting"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
ha-doctor = "ha_doctor.cli:main"

[tool.setuptools.packages.find]
include = ["ha_doctor*"]
